name: Sync Zaragoza parking data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar datos oficiales
        run: |
          mkdir -p data
          for i in 1 2 3 4 5; do
            echo "Intento $i de 5..."

            if curl -4 -L \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 2 \
              "https://www.zaragoza.es/trafico/estacionamientoots/Occupation.json" \
              -o data/occupation.json; then

              echo "Datos descargados correctamente"
              break
            fi

            echo "No se pudo conectar. Esperando 10 segundos..."
            sleep 10
          done

          test -s data/occupation.json
          

      - name: Preparar datos
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "data/occupation.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["source"] = "Ayuntamiento de Zaragoza"
          data["source_url"] = "https://www.zaragoza.es/trafico/estacionamientoots/Occupation.json"
          data["updated_at"] = datetime.now(timezone.utc).isoformat()

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Datos actualizados correctamente")

      - name: Guardar actualización
        run: |
          git config user.name "ZarPark Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/occupation.json
          git diff --cached --quiet || git commit -m "Actualizar ocupacion Zaragoza"
          git push
